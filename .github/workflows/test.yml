name: Test

on:
  push:
  pull_request:

# Least privilege for GITHUB_TOKEN. Without this the job inherits the
# repository/organisation default, which is commonly write-capable — and this
# workflow now runs a third-party action, so the blast radius of a compromised
# or moved action tag is whatever the token can do. Nothing here needs more
# than read.
permissions:
  contents: read

jobs:
  toolkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml
      - name: Lint Python (ruff)
        # The kit shipped engines that nothing had ever linted (issue #58). Two
        # of them were copied into a mature repo with repo-wide ruff and failed
        # on contact — and this step, on its first run, found a LIVE crash the
        # whole suite had missed: `yaml.YAMLError` in an `except` tuple with no
        # `yaml` import (F821), which turned every config-resolution failure
        # into a NameError inside its own error handler.
        #
        # Config lives in ruff.toml (NOT pyproject.toml — see the note in that
        # file; the reason is the plain `uv run … python` form, not PEP 723).
        # Deliberately lint-only: the kit is not ruff-format clean and does not
        # try to be, because no single formatting satisfies every adopter's
        # line-length. Adopters exclude the engines directory instead — see
        # docs/agentic-dev-kit/adopting-into-a-linted-repo.md.
        #
        # PINNED TO A COMMIT SHA, not the `v3` tag. This is the workflow's only
        # non-GitHub-owned action, and a tag is mutable: whoever controls it can
        # move it and run arbitrary code with this job's GITHUB_TOKEN on every
        # push and pull_request. `permissions:` above reduces what that token
        # can do; the SHA is what stops the swap.
        #
        # `version` is pinned too. Without it the action resolves to whatever
        # ruff released most recently (there is no pyproject.toml for it to read
        # a version from — see ruff.toml), so a new rule in the selected
        # prefixes turns CI red with no change to this repo. Worse, this step
        # runs BEFORE the tests, so that failure would mask all test signal.
        # Bump both deliberately.
        uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6  # v3
        with:
          version: "0.16.0"
          args: check --no-fix
      - name: Check shell syntax
        run: |
          bash -n scripts/dev_session.sh scripts/reconcile_sessions.sh scripts/lib/repo_root.sh scripts/hooks/pre-push
          sh -n init.sh
      - name: init.sh must be executable
        # The documented first command is `./init.sh`; a non-executable mode makes
        # it fail for every adopter at step one.
        run: test -x init.sh
      - name: Run state and portability tests
        run: python -m pytest scripts/lib/state_paths/tests scripts/tests -q
      - name: kit-manifest.json must be in sync
        # A stale manifest silently degrades every adopter's drift report to
        # "unknown-version", so the self-check is a gate, not a convenience.
        # Stdlib-only by design, so no uv needed here.
        run: python scripts/kit_doctor.py
      - name: Engines must work without PyYAML
        # The stdlib config reader exists so engines carry no third-party
        # dependency. Prove it in an env where PyYAML genuinely is not installed.
        run: |
          python -m pip uninstall -y pyyaml
          python -m pytest scripts/tests/test_kitconfig.py -q
