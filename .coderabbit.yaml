# CodeRabbit configuration for THIS repository.
#
# NOT A KIT ARTIFACT. This configures the review bot on the kit's own workspace,
# the same way `.github/workflows/test.yml` configures the kit's own CI. It is
# deliberately absent from `KIT_OWNED` in scripts/kit_doctor.py, so it is never
# manifest-tracked and never reaches an adopter through /adopt or /upgrade. An
# adopter running a different reviewer — or none at all (`review.bots: []`, which
# the engines handle as a first-class case) — is unaffected by every line here.
#
# WHY IT EXISTS (#372). CodeRabbit's OSS tier grants 1-10 PR reviews per hour,
# scaled by repo stars; this repo has 0, which puts it at the floor of that band.
# Its own record corroborates the position: #375 was reviewed at 06:16:27 and
# #377 was rate-limited at 06:43:56, 27 minutes later.
#
# The budget is therefore roughly ONE REVIEW PER HOUR, and both settings below
# are answers to the same question: where does that one unit go.
#
# ─── Ruling 1 (2026-08-15): stop spending it on fix rounds ───────────────────
#
# `auto_incremental_review` defaults to TRUE and every push spends a unit — and
# this repo's workflow pushes a new head per fix round. The 2026-08-15 five-lane
# batch landed 27 commits in ~25 distinct pushes across 6 PRs (commit timestamps
# clustered at a 3-minute threshold; GitHub does not report push events directly,
# so the push count is an estimate and the commit count is not). That is ~4.2
# units per PR. The bot was rate-limited on 5 of those 6, and the fallback panel
# carried every merge.
#
# THAT RULING WORKED, and it is the one measurement here that is settled: #484,
# #487 and #488 all show `Review skipped: incremental reviews are disabled`, and
# consumption fell to ~1 unit per PR. Note it did not take effect on the PR that
# introduced it (#483 re-reviewed its own second head), and #487 still saw an
# incremental review 2.5h after the file landed on `main` while #488 saw clean
# skips the next morning — so the vendor appears to cache this file for some
# hours. That delay is a property of any change to it, including this one.
#
# ─── Ruling 2 (2026-08-17): spend it at the head that MERGES, not the head that
#     OPENS ──────────────────────────────────────────────────────────────────
#
# With consumption at ~1 unit/PR, the remaining question was which head that unit
# lands on. Measured end-to-end on #488: the auto pass reviewed the opening head
# at 08:13, the loop converged at 08:34, and a hand-typed `@coderabbitai review`
# at the merging head came back `Review rate limited` — 22.6 minutes after the
# auto pass had spent the hour's unit.
#
# So the two halves of the previous posture COMPETE FOR THE SAME UNIT. Automating
# the request would change when the refusal arrives, not whether.
#
# Given one unit, spend it where the merge gate can use it:
#
#   - The opening head is superseded BY CONSTRUCTION on almost every PR here. Of
#     the six in the batch above, five took more than one push (#474 3 commits,
#     #475 8, #476 2, #477 2, #478 11; only #482 was single-commit). Reviewing it
#     bought an early finding and left the merging head with no bot evidence, so
#     the merge still paid a full fallback panel.
#   - Coverage at the MERGING head is itself independent-review evidence (#350,
#     shipped in #484 as the `bot-coverage` route). It satisfies `mergeable` with
#     no receipt recorded and no panel run.
#
# This is weakly dominant over the old setting rather than a trade: when the
# converged-head review comes back clean the PR merges on bot evidence, and when
# it does not, the fix moves the head and the PR lands exactly where the old
# setting put it unconditionally.
#
# THE COST, stated because it is real. Findings arrive at convergence instead of
# at open — relocated, not lost, since the bot still reviews the whole diff once.
# What is genuinely given up is EARLINESS: #488's one real finding (a stale
# docstring enumeration) came from the opening pass, and under this setting the
# agent would have built on that code longer before hearing about it.
#
# WHAT THIS DOES NOT SOLVE, so nobody re-derives it later. It reallocates the
# unit; it does not create more. A five-lane batch still needs five units, and
# the second PR of a session — the wrap-up PR, ~30 minutes behind the work PR —
# is still refused and still falls to the panel. That is the #375/#377 shape,
# unchanged. Only paying fixes those, and paying was declined 2026-08-17.
reviews:
  auto_review:
    # No automatic review at PR open. The single unit is requested at the
    # converged head instead — see the `Converged` stop condition in
    # docs/agentic-dev-kit/workflows/pr-watch.md.
    #
    # On-demand review SURVIVES this setting; that is the whole premise, so it is
    # sourced rather than assumed. CodeRabbit's auto-review page states it
    # outright: "Regardless of any auto-review configuration, you can always
    # trigger a review manually by commenting `@coderabbitai review`."
    # (https://docs.coderabbit.ai/configuration/auto-review, read 2026-08-17.)
    # The configuration reference alone does NOT say this — it documents only
    # `description_keyword` — so the reference page is not sufficient to verify
    # this key, which is worth knowing before anyone re-checks it there and
    # concludes the opposite.
    enabled: false
    # MOOT while `enabled` is false, and kept anyway on purpose: it makes the
    # revert safe. Flipping `enabled` back to true without this line would
    # silently restore the ~4.2-units/PR behaviour that ruling 1 measured and
    # removed, and that regression is invisible until a batch pays for it.
    auto_incremental_review: false
